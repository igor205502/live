<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Копирование в буфер обмена</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }

        .container {
            text-align: center;
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        button {
            background: #4CAF50;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        .status {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Копировать текст</h2>
        <button id="copyBtn">Копировать</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        const textToCopy = 'hysteria2://default:GnkBvE3eijxZql4qX5Wl28vC@german2262686.duckdns.org:443?sni=german2262686.duckdns.org&insecure=0#default';
        const copyBtn = document.getElementById('copyBtn');
        const statusEl = document.getElementById('status');

        copyBtn.addEventListener('click', async () => {
            try {
                // Современный способ
                await navigator.clipboard.writeText(textToCopy);
                statusEl.textContent = '✅ Текст скопирован в буфер обмена!';
            } catch (err) {
                // Запасной вариант для старых браузеров / http
                fallbackCopy(textToCopy);
            }
        });

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                statusEl.textContent = '✅ Текст скопирован в буфер обмена!';
            } catch (e) {
                statusEl.textContent = '❌ Не удалось скопировать текст';
            }
            document.body.removeChild(textarea);
        }
    </script>
</body>
</html>
